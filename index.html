<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Invasion Tower Defense</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body {
      margin: 0;
      padding: 18px 12px 30px;
      background: radial-gradient(circle at top, #26343a, #101719 65%);
      color: #f1f5f3;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 8px 0 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 3px 18px #000;
    }
    .subtitle {
      color: #9fb5ad;
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: bold;
    }
    #gameCanvas {
      background: #222;
      border: 2px solid #82958e;
      border-radius: 5px;
      display: block;
      box-shadow: 0 12px 35px rgba(0,0,0,.45);
      margin: 10px auto;
      max-width: calc(100vw - 24px);
      height: auto;
    }
    #accountPanel {
      max-width: 760px;
      margin: 14px auto;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #1b1b1b;
    }
    #accountStatus { color: #aaa; margin: 8px 0 12px; }
    .accountButton {
      margin: 4px;
      padding: 9px 14px;
      border: 0;
      border-radius: 7px;
      background: #286b58;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .accountButton.secondary { background: #444; }
    .accountButton:disabled { opacity: .5; cursor: wait; }
    #saveMessage { min-height: 1.2em; color: #9ad8bd; font-size: 13px; }
  </style>
</head>
<body>
  <h1>The Invasion: Tower Defense</h1>
  <p class="subtitle">EPISODE 1 — OLD CITY // Click the battlefield to place a tower</p>
  <section id="accountPanel">
    <h2>Player Account &amp; Saves</h2>
    <div id="accountStatus">Playing as guest — no account needed.</div>
    <button class="accountButton" id="signInButton">Sign in with Puter</button>
    <button class="accountButton secondary" id="signOutButton" hidden>Sign out</button>
    <div>
      <button class="accountButton secondary" id="cloudSaveButton" disabled>Save to cloud</button>
      <button class="accountButton secondary" id="cloudLoadButton" disabled>Load cloud save</button>
    </div>
    <div id="saveMessage" aria-live="polite"></div>
  </section>
  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // --- BASIC MAP / PATH ---
    // Path is a list of waypoints enemies will follow
    const path = [
      { x: 50,  y: 400 },
      { x: 200, y: 400 },
      { x: 400, y: 300 },
      { x: 600, y: 200 },
      { x: 750, y: 100 }
    ];

    // --- GAME OBJECT ARRAYS ---
    const enemies = [];
    const towers  = [];
    const bullets = [];

    // --- LOCAL + OPTIONAL PUTER CLOUD SAVES ---
    const LOCAL_SAVE_KEY = "invasion-tower-defense-save-v1";
    const CLOUD_SAVE_FILE = "the-invasion-tower-defense-save.json";
    const accountStatus = document.getElementById("accountStatus");
    const saveMessage = document.getElementById("saveMessage");
    const signInButton = document.getElementById("signInButton");
    const signOutButton = document.getElementById("signOutButton");
    const cloudSaveButton = document.getElementById("cloudSaveButton");
    const cloudLoadButton = document.getElementById("cloudLoadButton");

    function currentSaveData() {
      return {
        version: 1,
        savedAt: new Date().toISOString(),
        towers: towers.map(tower => ({ x: tower.x, y: tower.y }))
      };
    }

    function saveLocalGame() {
      try {
        localStorage.setItem(LOCAL_SAVE_KEY, JSON.stringify(currentSaveData()));
        saveMessage.textContent = "Progress saved on this device.";
      } catch (error) {
        saveMessage.textContent = "Couldn't save locally: " + error.message;
      }
    }

    function loadLocalGame() {
      try {
        const raw = localStorage.getItem(LOCAL_SAVE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.version !== 1 || !Array.isArray(data.towers)) return;
        data.towers.forEach(point => {
          if (Number.isFinite(point.x) && Number.isFinite(point.y)) {
            towers.push(new Tower(point.x, point.y));
          }
        });
        saveMessage.textContent = "Local progress loaded.";
      } catch (error) {
        saveMessage.textContent = "Couldn't load the local save.";
      }
    }

    async function refreshPuterAccount() {
      if (!window.puter || !puter.auth) {
        accountStatus.textContent = "Puter couldn't load. Guest play and local saves still work.";
        return;
      }
      try {
        if (puter.auth.isSignedIn()) {
          const user = await puter.auth.getUser();
          accountStatus.textContent = "Signed in" + (user && user.username ? " as " + user.username : "") + ". Cloud saves are available.";
          signInButton.hidden = true;
          signOutButton.hidden = false;
          cloudSaveButton.disabled = false;
          cloudLoadButton.disabled = false;
        } else {
          accountStatus.textContent = "Playing as guest — sign in to enable cloud saves.";
          signInButton.hidden = false;
          signOutButton.hidden = true;
          cloudSaveButton.disabled = true;
          cloudLoadButton.disabled = true;
        }
      } catch (error) {
        accountStatus.textContent = "Account status unavailable. Guest play still works.";
      }
    }

    signInButton.addEventListener("click", async () => {
      if (!window.puter || !puter.auth) {
        accountStatus.textContent = "Puter is unavailable right now. You can keep playing as a guest.";
        return;
      }
      signInButton.disabled = true;
      try {
        await puter.auth.signIn();
        await refreshPuterAccount();
        saveMessage.textContent = "You're signed in! Your local save is unchanged.";
      } catch (error) {
        saveMessage.textContent = "Sign-in was cancelled or unavailable. You can keep playing as a guest.";
      } finally {
        signInButton.disabled = false;
      }
    });

    signOutButton.addEventListener("click", async () => {
      try {
        await puter.auth.signOut();
        await refreshPuterAccount();
        saveMessage.textContent = "Signed out. Local progress remains on this device.";
      } catch (error) {
        saveMessage.textContent = "Couldn't sign out: " + (error.message || "Please try again.");
      }
    });

    cloudSaveButton.addEventListener("click", async () => {
      if (!window.puter || !puter.auth || !puter.auth.isSignedIn()) return;
      cloudSaveButton.disabled = true;
      try {
        await puter.fs.write(CLOUD_SAVE_FILE, JSON.stringify(currentSaveData()));
        saveMessage.textContent = "Cloud save uploaded successfully.";
      } catch (error) {
        saveMessage.textContent = "Cloud save failed: " + (error.message || "Please try again.");
      } finally {
        cloudSaveButton.disabled = false;
      }
    });

    cloudLoadButton.addEventListener("click", async () => {
      if (!window.puter || !puter.auth || !puter.auth.isSignedIn()) return;
      cloudLoadButton.disabled = true;
      try {
        const file = await puter.fs.read(CLOUD_SAVE_FILE);
        const data = JSON.parse(await file.text());
        if (data.version !== 1 || !Array.isArray(data.towers)) {
          throw new Error("This cloud save has an unsupported format.");
        }
        towers.length = 0;
        data.towers.forEach(point => {
          if (Number.isFinite(point.x) && Number.isFinite(point.y)) {
            towers.push(new Tower(point.x, point.y));
          }
        });
        saveLocalGame();
        saveMessage.textContent = "Cloud save loaded onto this device.";
      } catch (error) {
        saveMessage.textContent = "Couldn't load cloud save. You may not have uploaded one yet.";
      } finally {
        cloudLoadButton.disabled = false;
      }
    });

    let lastSpawn = 0;
    const spawnInterval = 1500; // ms

    // --- ENEMY CLASS ---
    class Enemy {
      constructor() {
        this.x = path[0].x;
        this.y = path[0].y;
        this.speed = 0.8;
        this.hp = 3;
        this.pathIndex = 0;
        this.radius = 12;
      }

      update(dt) {
        const target = path[this.pathIndex + 1];
        if (!target) return; // reached end (you can later subtract lives)

        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 1) {
          this.pathIndex++;
          return;
        }

        this.x += (dx / dist) * this.speed * dt;
        this.y += (dy / dist) * this.speed * dt;
      }

      draw() {
        ctx.fillStyle = "red"; // later: Skibidi Toilet sprite
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // --- TOWER CLASS ---
    class Tower {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.range = 120;
        this.fireRate = 600; // ms
        this.lastShot = 0;
      }

      update(dt, time) {
        // find first enemy in range
        let target = null;
        for (const e of enemies) {
          const dist = Math.hypot(e.x - this.x, e.y - this.y);
          if (dist <= this.range) {
            target = e;
            break;
          }
        }

        if (target && time - this.lastShot > this.fireRate) {
          this.shoot(target);
          this.lastShot = time;
        }
      }

      shoot(target) {
        bullets.push(new Bullet(this.x, this.y, target));
      }

      draw() {
        ctx.fillStyle = "cyan"; // later: Cameraman / Titan sprite
        ctx.beginPath();
        ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
        ctx.fill();

        // range circle (for debugging)
        ctx.strokeStyle = "rgba(0,255,255,0.2)";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // --- BULLET CLASS ---
    class Bullet {
      constructor(x, y, target) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.speed = 2.5;
        this.radius = 4;
        this.damage = 1;
        this.dead = false;
      }

      update(dt) {
        if (!this.target || this.target.hp <= 0) {
          this.dead = true;
          return;
        }

        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 5) {
          this.target.hp -= this.damage;
          this.dead = true;
          return;
        }

        this.x += (dx / dist) * this.speed * dt;
        this.y += (dy / dist) * this.speed * dt;
      }

      draw() {
        ctx.fillStyle = "yellow";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Distance from a point to the nearest point on the invasion route.
    function distanceToRoute(x, y) {
      let nearest = Infinity;
      for (let i = 0; i < path.length - 1; i++) {
        const a = path[i], b = path[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const lengthSq = dx * dx + dy * dy;
        const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / lengthSq));
        const px = a.x + t * dx, py = a.y + t * dy;
        nearest = Math.min(nearest, Math.hypot(x - px, y - py));
      }
      return nearest;
    }

    // --- INPUT: PLACE TOWERS ON CITY GROUND, NOT IN THE ROAD ---
    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      if (distanceToRoute(x, y) < 64) {
        saveMessage.textContent = "Can't build in the road — choose a sidewalk or open lot.";
        return;
      }
      if (towers.some(tower => Math.hypot(tower.x - x, tower.y - y) < 34)) {
        saveMessage.textContent = "That's too close to another tower.";
        return;
      }
      towers.push(new Tower(x, y));
      saveLocalGame();
    });

    // --- SPAWN ENEMIES ---
    function spawnEnemy() {
      enemies.push(new Enemy());
    }

    // --- GAME LOOP ---
    let lastTime = performance.now();

    function gameLoop(time) {
      const dt = time - lastTime;
      lastTime = time;

      // spawn enemies over time
      if (time - lastSpawn > spawnInterval) {
        spawnEnemy();
        lastSpawn = time;
      }

      update(dt, time);
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update(dt, time) {
      // update enemies
      for (const e of enemies) {
        e.update(dt);
      }
      // remove dead enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (enemies[i].hp <= 0) enemies.splice(i, 1);
      }

      // update towers
      for (const t of towers) {
        t.update(dt, time);
      }

      // update bullets
      for (const b of bullets) {
        b.update(dt);
      }
      // remove dead bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        if (bullets[i].dead) bullets.splice(i, 1);
      }
    }

    // --- TOP-DOWN OLD CITY BLOCKOUT ---
    // Original map artwork will replace this hand-built placeholder as we refine the layout.
    const cityBuildings = [
      {x:24,y:24,w:142,h:92,tone:0},
      {x:184,y:22,w:108,h:116,tone:1},
      {x:318,y:20,w:150,h:90,tone:2},
      {x:500,y:18,w:112,h:112,tone:0},
      {x:646,y:18,w:130,h:82,tone:1},
      {x:18,y:170,w:112,h:116,tone:2},
      {x:145,y:190,w:94,h:100,tone:0},
      {x:282,y:170,w:102,h:84,tone:1},
      {x:430,y:120,w:92,h:76,tone:2},
      {x:585,y:118,w:112,h:72,tone:0},
      {x:700,y:132,w:82,h:92,tone:1},
      {x:28,y:316,w:112,h:92,tone:1},
      {x:236,y:354,w:116,h:74,tone:2},
      {x:410,y:348,w:120,h:82,tone:0},
      {x:620,y:284,w:150,h:110,tone:2}
    ];
    const roofColors = ["#858b88", "#777f80", "#96958b"];

    function drawBuilding(b) {
      const roof = roofColors[b.tone];
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.fillRect(b.x + 5, b.y + 7, b.w, b.h);

      // building lot and narrow pavement apron
      ctx.fillStyle = "#a5a69b";
      ctx.fillRect(b.x - 5, b.y - 5, b.w + 10, b.h + 10);
      ctx.fillStyle = "#555e5c";
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = roof;
      ctx.fillRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8);

      // roof edge and subtle roof panel seams
      ctx.strokeStyle = "rgba(30,38,38,.55)";
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x + 7, b.y + 7, b.w - 14, b.h - 14);
      ctx.lineWidth = 1;
      for (let x = b.x + 18; x < b.x + b.w - 12; x += 25) {
        ctx.beginPath();
        ctx.moveTo(x, b.y + 9);
        ctx.lineTo(x, b.y + b.h - 9);
        ctx.stroke();
      }

      // rooftop equipment
      ctx.fillStyle = "#505a5b";
      ctx.fillRect(b.x + b.w * .18, b.y + b.h * .2, Math.max(15, b.w * .22), 13);
      ctx.fillStyle = "#b9b9ad";
      ctx.fillRect(b.x + b.w * .62, b.y + b.h * .58, Math.max(13, b.w * .2), 11);
      ctx.fillStyle = "#3e494a";
      ctx.fillRect(b.x + b.w * .48, b.y + b.h * .16, 12, 20);

      // rooftop access hatch
      ctx.fillStyle = "#626a68";
      ctx.fillRect(b.x + b.w * .42, b.y + b.h * .42, 20, 17);
      ctx.strokeStyle = "rgba(230,230,210,.35)";
      ctx.strokeRect(b.x + b.w * .42, b.y + b.h * .42, 20, 17);
    }

    function drawTree(x, y, size) {
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.beginPath();
      ctx.arc(x + 3, y + 4, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#344d3d";
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#587451";
      ctx.beginPath();
      ctx.arc(x - 2, y - 2, size * .68, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#82916a";
      ctx.beginPath();
      ctx.arc(x - 4, y - 5, size * .25, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParkedCar(x, y, angle, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.fillStyle = "rgba(0,0,0,.28)";
      ctx.fillRect(-13, -5, 30, 16);
      ctx.fillStyle = "#252d30";
      ctx.fillRect(-15, -8, 30, 16);
      ctx.fillStyle = color;
      ctx.fillRect(-13, -7, 26, 13);
      ctx.fillStyle = "#a9c0bd";
      ctx.fillRect(-7, -5, 12, 9);
      ctx.fillStyle = "#d8d0a5";
      ctx.fillRect(10, -5, 2, 3);
      ctx.fillRect(10, 2, 2, 3);
      ctx.fillStyle = "#b64f43";
      ctx.fillRect(-12, -5, 2, 3);
      ctx.fillRect(-12, 2, 2, 3);
      ctx.restore();
    }

    function drawStreetLight(x, y) {
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.beginPath(); ctx.arc(x + 3, y + 4, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#303a3b";
      ctx.fillRect(x - 2, y - 2, 4, 12);
      ctx.fillRect(x - 2, y - 5, 10, 3);
      ctx.fillStyle = "#d8d3a2";
      ctx.fillRect(x + 5, y - 6, 5, 5);
    }

    function drawCityMap() {
      // concrete city ground with subtle block texture
      ctx.fillStyle = "#737c72";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < canvas.height; y += 32) {
        for (let x = 0; x < canvas.width; x += 32) {
          ctx.fillStyle = ((x / 32 + y / 32) % 2 === 0) ? "rgba(220,220,190,.035)" : "rgba(20,30,28,.035)";
          ctx.fillRect(x, y, 32, 32);
        }
      }

      // lots and buildings
      for (const b of cityBuildings) drawBuilding(b);

      // road shoulders, sidewalks, curbs, then asphalt
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      function strokeRoute(color, width) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.stroke();
      }
      strokeRoute("#aeb0a3", 116);
      strokeRoute("#666e6b", 104);
      strokeRoute("#30393b", 88);

      // lane dashes following the invasion road
      ctx.save();
      ctx.setLineDash([18, 18]);
      strokeRoute("rgba(218,211,177,.65)", 2);
      ctx.restore();

      // road edge markings
      ctx.save();
      ctx.setLineDash([7, 13]);
      strokeRoute("rgba(190,198,184,.32)", 1);
      ctx.restore();

      // crosswalks at the main bends
      const crossings = [{x:200,y:400,angle:-0.46},{x:400,y:300,angle:-0.46},{x:600,y:200,angle:-0.59}];
      for (const cross of crossings) {
        ctx.save();
        ctx.translate(cross.x, cross.y);
        ctx.rotate(cross.angle);
        ctx.fillStyle = "rgba(225,225,210,.62)";
        for (let i = -3; i <= 3; i++) ctx.fillRect(i * 9 - 2, -48, 4, 96);
        ctx.restore();
      }

      // street trees and small planted areas
      const trees = [
        [166,155,10],[270,155,9],[395,150,10],[550,145,9],[720,260,10],
        [160,320,9],[365,390,8],[555,300,9],[785,35,8],[18,120,8]
      ];
      for (const tree of trees) drawTree(...tree);

      // parked cars and street furniture make the blocks feel inhabited
      drawParkedCar(250, 145, 0, "#536d78");
      drawParkedCar(468, 82, 0, "#8a5145");
      drawParkedCar(112, 300, Math.PI / 2, "#777d68");
      drawParkedCar(744, 310, Math.PI / 2, "#596b59");
      [[174,178],[300,145],[548,115],[710,242],[150,300],[570,330],[390,405]]
        .forEach(point => drawStreetLight(point[0], point[1]));

      // painted parking bays beside selected buildings
      ctx.save();
      ctx.strokeStyle = "rgba(224,222,194,.55)";
      ctx.lineWidth = 2;
      [[205,150,42],[420,80,38],[675,245,42]].forEach(([x,y,w]) => {
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x + w, y);
        ctx.moveTo(x, y + 20); ctx.lineTo(x + w, y + 20);
        ctx.moveTo(x, y); ctx.lineTo(x, y + 20);
        ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + 20);
        ctx.stroke();
      });
      ctx.restore();

      // small road drains and manhole covers
      const details = [[88,382],[330,335],[520,240],[680,150],[730,118]];
      for (const [x,y] of details) {
        ctx.fillStyle = "#222b2d";
        ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#68716e";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.stroke();
      }

      // map label
      ctx.fillStyle = "rgba(8,15,17,.72)";
      ctx.fillRect(12, 12, 145, 24);
      ctx.fillStyle = "#d6e1d9";
      ctx.font = "bold 11px Arial";
      ctx.textAlign = "left";
      ctx.fillText("OLD CITY  /  EP. 01", 21, 28);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCityMap();

      for (const e of enemies) e.draw();
      for (const t of towers) t.draw();
      for (const b of bullets) b.draw();
    }

    loadLocalGame();
    refreshPuterAccount();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
