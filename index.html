<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Invasion Tower Defense</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }
    #gameCanvas {
      background: #222;
      border: 2px solid #fff;
      display: block;
      margin: 10px auto;
      max-width: calc(100vw - 24px);
      height: auto;
    }
    #accountPanel {
      max-width: 760px;
      margin: 14px auto;
      padding: 14px;
      border: 1px solid #444;
      border-radius: 12px;
      background: #1b1b1b;
    }
    #accountStatus { color: #aaa; margin: 8px 0 12px; }
    .accountButton {
      margin: 4px;
      padding: 9px 14px;
      border: 0;
      border-radius: 7px;
      background: #286b58;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    .accountButton.secondary { background: #444; }
    .accountButton:disabled { opacity: .5; cursor: wait; }
    #saveMessage { min-height: 1.2em; color: #9ad8bd; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Hedge Tower Defense Starter</h1>
  <p>Click the battlefield to place a tower. Your progress is saved locally automatically.</p>
  <section id="accountPanel">
    <h2>Player Account &amp; Saves</h2>
    <div id="accountStatus">Playing as guest — no account needed.</div>
    <button class="accountButton" id="signInButton">Sign in with Puter</button>
    <button class="accountButton secondary" id="signOutButton" hidden>Sign out</button>
    <div>
      <button class="accountButton secondary" id="cloudSaveButton" disabled>Save to cloud</button>
      <button class="accountButton secondary" id="cloudLoadButton" disabled>Load cloud save</button>
    </div>
    <div id="saveMessage" aria-live="polite"></div>
  </section>
  <canvas id="gameCanvas" width="800" height="450"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // --- BASIC MAP / PATH ---
    // Path is a list of waypoints enemies will follow
    const path = [
      { x: 50,  y: 400 },
      { x: 200, y: 400 },
      { x: 400, y: 300 },
      { x: 600, y: 200 },
      { x: 750, y: 100 }
    ];

    // --- GAME OBJECT ARRAYS ---
    const enemies = [];
    const towers  = [];
    const bullets = [];

    // --- LOCAL + OPTIONAL PUTER CLOUD SAVES ---
    const LOCAL_SAVE_KEY = "invasion-tower-defense-save-v1";
    const CLOUD_SAVE_FILE = "the-invasion-tower-defense-save.json";
    const accountStatus = document.getElementById("accountStatus");
    const saveMessage = document.getElementById("saveMessage");
    const signInButton = document.getElementById("signInButton");
    const signOutButton = document.getElementById("signOutButton");
    const cloudSaveButton = document.getElementById("cloudSaveButton");
    const cloudLoadButton = document.getElementById("cloudLoadButton");

    function currentSaveData() {
      return {
        version: 1,
        savedAt: new Date().toISOString(),
        towers: towers.map(tower => ({ x: tower.x, y: tower.y }))
      };
    }

    function saveLocalGame() {
      try {
        localStorage.setItem(LOCAL_SAVE_KEY, JSON.stringify(currentSaveData()));
        saveMessage.textContent = "Progress saved on this device.";
      } catch (error) {
        saveMessage.textContent = "Couldn't save locally: " + error.message;
      }
    }

    function loadLocalGame() {
      try {
        const raw = localStorage.getItem(LOCAL_SAVE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.version !== 1 || !Array.isArray(data.towers)) return;
        data.towers.forEach(point => {
          if (Number.isFinite(point.x) && Number.isFinite(point.y)) {
            towers.push(new Tower(point.x, point.y));
          }
        });
        saveMessage.textContent = "Local progress loaded.";
      } catch (error) {
        saveMessage.textContent = "Couldn't load the local save.";
      }
    }

    async function refreshPuterAccount() {
      if (!window.puter || !puter.auth) {
        accountStatus.textContent = "Puter couldn't load. Guest play and local saves still work.";
        return;
      }
      try {
        if (puter.auth.isSignedIn()) {
          const user = await puter.auth.getUser();
          accountStatus.textContent = "Signed in" + (user && user.username ? " as " + user.username : "") + ". Cloud saves are available.";
          signInButton.hidden = true;
          signOutButton.hidden = false;
          cloudSaveButton.disabled = false;
          cloudLoadButton.disabled = false;
        } else {
          accountStatus.textContent = "Playing as guest — sign in to enable cloud saves.";
          signInButton.hidden = false;
          signOutButton.hidden = true;
          cloudSaveButton.disabled = true;
          cloudLoadButton.disabled = true;
        }
      } catch (error) {
        accountStatus.textContent = "Account status unavailable. Guest play still works.";
      }
    }

    signInButton.addEventListener("click", async () => {
      if (!window.puter || !puter.auth) {
        accountStatus.textContent = "Puter is unavailable right now. You can keep playing as a guest.";
        return;
      }
      signInButton.disabled = true;
      try {
        await puter.auth.signIn();
        await refreshPuterAccount();
        saveMessage.textContent = "You're signed in! Your local save is unchanged.";
      } catch (error) {
        saveMessage.textContent = "Sign-in was cancelled or unavailable. You can keep playing as a guest.";
      } finally {
        signInButton.disabled = false;
      }
    });

    signOutButton.addEventListener("click", async () => {
      try {
        await puter.auth.signOut();
        await refreshPuterAccount();
        saveMessage.textContent = "Signed out. Local progress remains on this device.";
      } catch (error) {
        saveMessage.textContent = "Couldn't sign out: " + (error.message || "Please try again.");
      }
    });

    cloudSaveButton.addEventListener("click", async () => {
      if (!window.puter || !puter.auth || !puter.auth.isSignedIn()) return;
      cloudSaveButton.disabled = true;
      try {
        await puter.fs.write(CLOUD_SAVE_FILE, JSON.stringify(currentSaveData()));
        saveMessage.textContent = "Cloud save uploaded successfully.";
      } catch (error) {
        saveMessage.textContent = "Cloud save failed: " + (error.message || "Please try again.");
      } finally {
        cloudSaveButton.disabled = false;
      }
    });

    cloudLoadButton.addEventListener("click", async () => {
      if (!window.puter || !puter.auth || !puter.auth.isSignedIn()) return;
      cloudLoadButton.disabled = true;
      try {
        const file = await puter.fs.read(CLOUD_SAVE_FILE);
        const data = JSON.parse(await file.text());
        if (data.version !== 1 || !Array.isArray(data.towers)) {
          throw new Error("This cloud save has an unsupported format.");
        }
        towers.length = 0;
        data.towers.forEach(point => {
          if (Number.isFinite(point.x) && Number.isFinite(point.y)) {
            towers.push(new Tower(point.x, point.y));
          }
        });
        saveLocalGame();
        saveMessage.textContent = "Cloud save loaded onto this device.";
      } catch (error) {
        saveMessage.textContent = "Couldn't load cloud save. You may not have uploaded one yet.";
      } finally {
        cloudLoadButton.disabled = false;
      }
    });

    let lastSpawn = 0;
    const spawnInterval = 1500; // ms

    // --- ENEMY CLASS ---
    class Enemy {
      constructor() {
        this.x = path[0].x;
        this.y = path[0].y;
        this.speed = 0.8;
        this.hp = 3;
        this.pathIndex = 0;
        this.radius = 12;
      }

      update(dt) {
        const target = path[this.pathIndex + 1];
        if (!target) return; // reached end (you can later subtract lives)

        const dx = target.x - this.x;
        const dy = target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 1) {
          this.pathIndex++;
          return;
        }

        this.x += (dx / dist) * this.speed * dt;
        this.y += (dy / dist) * this.speed * dt;
      }

      draw() {
        ctx.fillStyle = "red"; // later: Skibidi Toilet sprite
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // --- TOWER CLASS ---
    class Tower {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.range = 120;
        this.fireRate = 600; // ms
        this.lastShot = 0;
      }

      update(dt, time) {
        // find first enemy in range
        let target = null;
        for (const e of enemies) {
          const dist = Math.hypot(e.x - this.x, e.y - this.y);
          if (dist <= this.range) {
            target = e;
            break;
          }
        }

        if (target && time - this.lastShot > this.fireRate) {
          this.shoot(target);
          this.lastShot = time;
        }
      }

      shoot(target) {
        bullets.push(new Bullet(this.x, this.y, target));
      }

      draw() {
        ctx.fillStyle = "cyan"; // later: Cameraman / Titan sprite
        ctx.beginPath();
        ctx.arc(this.x, this.y, 15, 0, Math.PI * 2);
        ctx.fill();

        // range circle (for debugging)
        ctx.strokeStyle = "rgba(0,255,255,0.2)";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.range, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // --- BULLET CLASS ---
    class Bullet {
      constructor(x, y, target) {
        this.x = x;
        this.y = y;
        this.target = target;
        this.speed = 2.5;
        this.radius = 4;
        this.damage = 1;
        this.dead = false;
      }

      update(dt) {
        if (!this.target || this.target.hp <= 0) {
          this.dead = true;
          return;
        }

        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 5) {
          this.target.hp -= this.damage;
          this.dead = true;
          return;
        }

        this.x += (dx / dist) * this.speed * dt;
        this.y += (dy / dist) * this.speed * dt;
      }

      draw() {
        ctx.fillStyle = "yellow";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // --- INPUT: PLACE TOWERS ON CLICK ---
    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      towers.push(new Tower(x, y));
      saveLocalGame();
    });

    // --- SPAWN ENEMIES ---
    function spawnEnemy() {
      enemies.push(new Enemy());
    }

    // --- GAME LOOP ---
    let lastTime = performance.now();

    function gameLoop(time) {
      const dt = time - lastTime;
      lastTime = time;

      // spawn enemies over time
      if (time - lastSpawn > spawnInterval) {
        spawnEnemy();
        lastSpawn = time;
      }

      update(dt, time);
      draw();

      loadLocalGame();
    refreshPuterAccount();
    requestAnimationFrame(gameLoop);
    }

    function update(dt, time) {
      // update enemies
      for (const e of enemies) {
        e.update(dt);
      }
      // remove dead enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        if (enemies[i].hp <= 0) enemies.splice(i, 1);
      }

      // update towers
      for (const t of towers) {
        t.update(dt, time);
      }

      // update bullets
      for (const b of bullets) {
        b.update(dt);
      }
      // remove dead bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        if (bullets[i].dead) bullets.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // draw path
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 20;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(path[0].x, path[0].y);
      for (let i = 1; i < path.length; i++) {
        ctx.lineTo(path[i].x, path[i].y);
      }
      ctx.stroke();

      // draw enemies
      for (const e of enemies) {
        e.draw();
      }

      // draw towers
      for (const t of towers) {
        t.draw();
      }

      // draw bullets
      for (const b of bullets) {
        b.draw();
      }
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
